<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA Club Mileage Store</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background-color: #020617; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://hhjqwbvxigjobkdlabor.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NclsaKLTsNstArrEkVRIiA_knj5G4Mi';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    function App() {
      const [users, setUsers] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [items, setItems] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [battles, setBattles] = useState([]);
      const [loadingData, setLoadingData] = useState(true);

      const mapProfile = p => ({ id:p.id, username:p.username, name:p.display_name, role:p.role, points:p.points });
      const mapProduct = p => ({ id:p.id, title:p.title, category:p.category, price:p.price, stock:p.stock, icon:p.icon, description:p.description, tag:p.tag });
      
      const mapTransaction = t => {
        const useTime = t.use_date ? new Date(t.use_date).getTime() : 0;
        const createTime = new Date(t.created_at).getTime() || 0;
        return { 
          id: t.id, 
          userId: t.user_id, 
          userName: t.user_name, 
          type: t.type, 
          amount: t.amount, 
          itemTitle: t.item_title, 
          status: t.status, 
          used: t.used, 
          usedTarget: t.used_target, 
          useDate: t.use_date ? new Date(t.use_date).toLocaleString('ko-KR') : '', 
          date: new Date(t.created_at).toLocaleString('ko-KR'), 
          timestamp: createTime,
          useTimestamp: useTime || createTime
        };
      };
      
      const mapBattle = b => ({ id:b.id, challenger:b.challenger, defender:b.defender, battleDate:b.battle_date, status:b.status, winner:b.winner, loser:b.loser, note:b.note });

      const refreshData = async () => {
        setLoadingData(true);
        const [pr, ur, tr, br] = await Promise.all([
          supabase.from('products').select('*').eq('active', true).order('id', { ascending: true }),
          supabase.from('profiles').select('*').order('created_at'),
          supabase.from('transactions').select('*').order('created_at', { ascending: false }).limit(500),
          supabase.from('battles').select('*').order('battle_date', {ascending:false})
        ]);
        const err = pr.error || ur.error || tr.error || br.error;
        if (err) showToast('데이터 불러오기 실패: ' + err.message, 'error');
        setItems((pr.data||[]).map(mapProduct)); setUsers((ur.data||[]).map(mapProfile));
        setTransactions((tr.data||[]).map(mapTransaction)); setBattles((br.data||[]).map(mapBattle));
        setLoadingData(false);
      };

      const loadSession = async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) await loadCurrentProfile(session.user.id);
        await refreshData();
      };

      const loadCurrentProfile = async (id) => {
        const { data, error } = await supabase.from('profiles').select('*').eq('id', id).single();
        if (!error && data) setCurrentUser(mapProfile(data));
      };

      useEffect(() => {
        loadSession();
        const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
          if (!session) setCurrentUser(null);
          else setTimeout(() => loadCurrentProfile(session.user.id), 0);
        });
        return () => listener.subscription.unsubscribe();
      }, []);

      const [activeTab, setActiveTab] = useState('store');
      const [selectedCategory, setSelectedCategory] = useState('전체');
      const [searchQuery, setSearchQuery] = useState('');

      const [selectedItemForPurchase, setSelectedItemForPurchase] = useState(null);
      const [selectedItemForUse, setSelectedItemForUse] = useState(null);
      const [targetUserForUse, setTargetUserForUse] = useState('');
      const [showAddItemModal, setShowAddItemModal] = useState(false);
      const [showAddBattleModal, setShowAddBattleModal] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      
      const [selectedBattleForEdit, setSelectedBattleForEdit] = useState(null);
      const [battleResultForm, setBattleResultForm] = useState({ winner: '', loser: '' });

      const [authMode, setAuthMode] = useState('login');
      const [toastMessage, setToastMessage] = useState(null);

      const [adminGrantForm, setAdminGrantForm] = useState({ targetUserId: '', amount: '', reason: '' });
      const [newItemForm, setNewItemForm] = useState({ title: '', category: '게임 아이템', price: '', stock: '', icon: '🎁', description: '', tag: '' });
      const [newBattleForm, setNewBattleForm] = useState({ challenger: '', defender: '', battleDate: '', note: '' });
      const [authForm, setAuthForm] = useState({ username: '', name: '', password: '' });

      const showToast = (msg, type = 'info') => {
        setToastMessage({ text: msg, type });
        setTimeout(() => setToastMessage(null), 3000);
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        const username = authForm.username.trim();
        if (!username) { showToast('아이디를 입력해 주세요.', 'error'); return; }

        const email = `${username}@fc-club-mileage.invalid`;
        
        if (authMode === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password: authForm.password });
          if (error) { showToast('로그인 실패: 아이디 또는 비밀번호를 확인해 주세요.', 'error'); return; }
          const { data: { user } } = await supabase.auth.getUser();
          await loadCurrentProfile(user.id); await refreshData(); setShowAuthModal(false);
          setAuthForm({ username:'', name:'', password:'' }); showToast('로그인되었습니다.', 'success');
        } else {
          if (!authForm.name.trim()) { showToast('이름을 입력해 주세요.', 'error'); return; }
          const { data, error } = await supabase.auth.signUp({ 
            email, 
            password: authForm.password, 
            options:{ data:{ username, display_name:authForm.name.trim() } } 
          });
          if (error) { showToast('회원가입 실패: ' + error.message, 'error'); return; }
          await loadCurrentProfile(data.user.id); await refreshData(); setShowAuthModal(false);
          setAuthForm({ username:'', name:'', password:'' }); showToast('가입 완료! 1,000pt가 지급되었습니다.', 'success');
        }
      };

      const handleLogout = async () => { await supabase.auth.signOut(); setCurrentUser(null); setActiveTab('store'); showToast('로그아웃 되었습니다.', 'info'); };

      const handleDailyCheckIn = async () => {
        if (!currentUser) return;
        const { error } = await supabase.rpc('check_in_daily');
        if (error) {
          showToast(error.message, 'error');
          return;
        }
        await refreshData();
        await loadCurrentProfile(currentUser.id);
        showToast('🎉 출석체크 완료! 100pt가 적립되었습니다.', 'success');
      };

      const handlePurchase = async () => {
        if (!selectedItemForPurchase || !currentUser) return;
        const { error } = await supabase.rpc('purchase_product', { p_product_id: selectedItemForPurchase.id });
        if (error) { showToast('구매 실패: ' + error.message, 'error'); return; }
        setSelectedItemForPurchase(null); await refreshData(); await loadCurrentProfile(currentUser.id); showToast(`'${selectedItemForPurchase.title}' 구매 완료!`, 'success');
      };

      const handleUseItem = async () => {
        if (!selectedItemForUse || !currentUser) return;
        const tx = selectedItemForUse;
        const needsTarget = tx.itemTitle.includes('신청권') || tx.itemTitle.includes('공격권') || tx.itemTitle.includes('방어권');
        if (needsTarget && !targetUserForUse) { showToast('사용 대상을 선택해 주세요.', 'error'); return; }
        const { error } = await supabase.rpc('use_purchased_item', { p_transaction_id: tx.id, p_target: targetUserForUse || null });
        if (error) { showToast('아이템 사용 실패: ' + error.message, 'error'); return; }
        setSelectedItemForUse(null); setTargetUserForUse(''); await refreshData(); showToast('아이템 사용 완료!', 'success');
      };

      const handleDeleteUser = async (targetUserId, targetUserName) => {
        if (!confirm(`정말 '${targetUserName}' 회원을 삭제하시겠습니까?`)) return;
        const { error } = await supabase.from('profiles').delete().eq('id', targetUserId);
        if (error) { showToast('회원 삭제 실패: ' + error.message, 'error'); return; }
        await refreshData();
        showToast(`'${targetUserName}' 회원이 삭제되었습니다.`, 'success');
      };

      const handleDeleteLog = async (logId) => {
        if (!confirm('이 활동 로그를 삭제하시겠습니까?')) return;
        const { error } = await supabase.from('transactions').delete().eq('id', logId);
        if (error) { showToast('로그 삭제 실패: ' + error.message, 'error'); return; }
        await refreshData();
        showToast('활동 로그가 삭제되었습니다.', 'success');
      };

      const handleUpdateBattleResult = async (e) => {
        e.preventDefault();
        if (!selectedBattleForEdit) return;
        if (!battleResultForm.winner || !battleResultForm.loser) {
          showToast('승자와 패자를 모두 선택해주세요.', 'error');
          return;
        }
        if (battleResultForm.winner === battleResultForm.loser) {
          showToast('승자와 패자는 동일할 수 없습니다.', 'error');
          return;
        }

        const { error } = await supabase.rpc('admin_update_battle_result', {
          p_battle_id: String(selectedBattleForEdit.id),
          p_winner: battleResultForm.winner,
          p_loser: battleResultForm.loser
        });

        if (error) {
          showToast('경기 결과 수정 실패: ' + error.message, 'error');
          return;
        }

        setSelectedBattleForEdit(null);
        setBattleResultForm({ winner: '', loser: '' });
        await refreshData();
        showToast('교체혈전 결과가 성공적으로 등록되었습니다!', 'success');
      };

      const getAttackersTargetingMe = () => {
        if (!currentUser) return [];
        const attackerNames = transactions
          .filter(t => t.used && (t.itemTitle.includes('신청권') || t.itemTitle.includes('공격권')))
          .filter(t => t.usedTarget === currentUser.name || t.usedTarget === currentUser.username || t.itemTitle.includes(`대상: ${currentUser.name}`))
          .map(t => t.userName);
        return [...new Set(attackerNames)];
      };

      const filteredItems = items.filter(item => {
        const matchesCategory = selectedCategory === '전체' || item.category === selectedCategory;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      // 내 보유 아이템 목록
      const myPurchasedItems = currentUser 
        ? transactions.filter(t => t.userId === currentUser.id && t.type === 'SPEND' && t.status === 'COMPLETED')
        : [];

      // [개인 마일리지 내역] 로그인한 본인의 모든 거래/적립/차감/구매 내역
      const myPersonalHistory = currentUser
        ? transactions.filter(t => t.userId === currentUser.id)
        : [];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-20">
          {toastMessage && (
            <div className={`fixed top-5 right-5 z-50 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-bold ${
              toastMessage.type === 'error' ? 'bg-rose-950 text-rose-200 border-rose-500/50' :
              toastMessage.type === 'success' ? 'bg-emerald-950 text-emerald-200 border-emerald-500/50' :
              'bg-slate-900 text-cyan-300 border-cyan-500/50'
            }`}>
              {toastMessage.text}
            </div>
          )}

          <header className="sticky top-0 z-40 bg-slate-900/90 border-b border-slate-800 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-cyan-500 text-slate-950 flex items-center justify-center font-black text-lg">FC</div>
                <div>
                  <h1 className="font-black text-base text-cyan-400">FC CLUB MILEAGE STORE</h1>
                  <span className="text-[10px] text-slate-400 font-semibold block">남자는 싸커지 마일리지 상점</span>
                </div>
              </div>
              <div>
                {currentUser ? (
                  <div className="flex items-center gap-3">
                    <button 
                      onClick={handleDailyCheckIn}
                      className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black text-xs hover:brightness-110 shadow-lg shadow-amber-500/20 flex items-center gap-1.5 transition-all"
                    >
                      <span>📅</span> 출석체크 (+100pt)
                    </button>
                    
                    <div className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-2xl">
                      <span className="text-[10px] text-slate-400 font-bold block">{currentUser.name} (@{currentUser.username})</span>
                      <span className="text-xs font-black text-cyan-400">{currentUser.points.toLocaleString()} pt</span>
                    </div>
                    <button onClick={handleLogout} className="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700">로그아웃</button>
                  </div>
                ) : (
                  <div className="flex gap-2">
                    <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="px-3 py-2 rounded-xl bg-slate-800 text-slate-200 font-bold text-xs">로그인</button>
                    <button onClick={() => { setAuthMode('signup'); setShowAuthModal(true); }} className="px-3 py-2 rounded-xl bg-cyan-500 text-slate-950 font-black text-xs">회원가입 (+1000pt)</button>
                  </div>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 pt-6 space-y-6">
            <div className="flex items-center gap-2 overflow-x-auto pb-2 border-b border-slate-800 no-scrollbar">
              <button onClick={() => setActiveTab('store')} className={`px-4 py-2.5 rounded-2xl text-xs font-extrabold ${activeTab === 'store' ? 'bg-cyan-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>🛍️ 마일리지 상점</button>
              <button onClick={() => setActiveTab('battleNotice')} className={`px-4 py-2.5 rounded-2xl text-xs font-extrabold ${activeTab === 'battleNotice' ? 'bg-rose-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>⚔️ 교체혈전 공지사항</button>
              <button onClick={() => setActiveTab('feed')} className={`px-4 py-2.5 rounded-2xl text-xs font-extrabold ${activeTab === 'feed' ? 'bg-cyan-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>📢 사용 활동 공지</button>
              {currentUser && (
                <button onClick={() => setActiveTab('inventory')} className={`px-4 py-2.5 rounded-2xl text-xs font-extrabold ${activeTab === 'inventory' ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>🎁 내 보관함 & 마일리지 내역 ({myPurchasedItems.filter(i => !i.used).length})</button>
              )}
              {currentUser?.role === 'admin' && (
                <button onClick={() => setActiveTab('admin')} className={`px-4 py-2.5 rounded-2xl text-xs font-extrabold ${activeTab === 'admin' ? 'bg-purple-600 text-white' : 'bg-slate-900 text-purple-400'}`}>👑 관리자 대시보드</button>
              )}
            </div>

            {activeTab === 'store' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center bg-slate-900 p-4 rounded-3xl border border-slate-800">
                  <div className="flex gap-2">
                    {['전체', '게임 아이템', '대외활동'].map(cat => (
                      <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${selectedCategory === cat ? 'bg-cyan-500 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>{cat}</button>
                    ))}
                  </div>
                  <input type="text" placeholder="검색..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200" />
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {filteredItems.map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between">
                      <div>
                        <div className="text-3xl mb-3">{item.icon}</div>
                        <h3 className="font-extrabold text-slate-100">{item.title}</h3>
                        <p className="text-xs text-slate-400 mt-2">{item.description}</p>
                      </div>
                      <div className="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center">
                        <span className="text-cyan-400 font-bold font-mono">{item.price.toLocaleString()} pt</span>
                        <button onClick={() => { if (!currentUser) { setAuthMode('login'); setShowAuthModal(true); return; } setSelectedItemForPurchase(item); }} className="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs">구매하기</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'battleNotice' && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-rose-400">⚔️ 교체혈전 경기 공지</h3>
                  {currentUser?.role === 'admin' && (
                    <span className="text-[11px] text-slate-400">* 관리자는 진행 중인 경기를 클릭하여 결과를 입력할 수 있습니다.</span>
                  )}
                </div>
                <div className="space-y-4">
                  {battles.map(b => (
                    <div 
                      key={b.id} 
                      onClick={() => {
                        if (currentUser?.role === 'admin') {
                          setSelectedBattleForEdit(b);
                          setBattleResultForm({ winner: b.winner || b.challenger, loser: b.loser || b.defender });
                        }
                      }}
                      className={`p-4 bg-slate-950 rounded-2xl border border-slate-800 flex justify-between items-center text-xs transition-all ${
                        currentUser?.role === 'admin' ? 'cursor-pointer hover:border-rose-500/50 hover:bg-slate-900/60' : ''
                      }`}
                    >
                      <div>
                        <span className="text-slate-400 font-mono">시행 일자: {b.battleDate}</span>
                        <div className="text-sm font-bold mt-1 text-slate-100">{b.challenger} vs {b.defender}</div>
                      </div>
                      <div className="text-right flex items-center gap-3">
                        {b.status === 'COMPLETED' ? (
                          <span className="text-emerald-400 font-bold">승: {b.winner} / 패: {b.loser}</span>
                        ) : (
                          <div className="flex items-center gap-2">
                            <span className="text-amber-400 font-bold">진행 중</span>
                            {currentUser?.role === 'admin' && (
                              <span className="px-2 py-1 rounded bg-rose-600 text-white text-[10px] font-bold">결과 입력</span>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* [공지 탭] 출석체크/개인 포인트 적립은 제외하고 '아이템 사용 완료' 내역만 출력 */}
            {activeTab === 'feed' && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-3">
                <h3 className="font-bold text-cyan-400 mb-4">📢 아이템 사용 활동 공지 (전체 공개)</h3>
                {[...transactions]
                  .filter(t => t.used && t.type !== 'CHECKIN' && t.type !== 'ADMIN_GRANT' && t.type !== 'EARN')
                  .sort((a, b) => b.useTimestamp - a.useTimestamp)
                  .map(t => {
                    const isMyLog = currentUser && (
                      t.userId === currentUser.id ||
                      t.userName === currentUser.name ||
                      t.userName === currentUser.username
                    );
                    return (
                      <div key={t.id} className={`p-3.5 rounded-2xl text-xs flex justify-between items-center transition-all ${
                        isMyLog 
                          ? 'bg-cyan-950/70 border-2 border-cyan-400 shadow-lg shadow-cyan-500/20 my-1' 
                          : 'bg-slate-950 border border-slate-800/80'
                      }`}>
                        <div className="flex items-center gap-2.5">
                          {isMyLog && (
                            <span className="px-2 py-0.5 rounded-lg bg-cyan-400 text-slate-950 font-black text-[10px] animate-pulse">
                              내 활동
                            </span>
                          )}
                          <span>
                            <strong className={isMyLog ? 'text-cyan-300 font-black text-sm underline underline-offset-4 decoration-cyan-400' : 'text-cyan-400 font-bold'}>
                              {t.userName}
                            </strong> 
                            <span className={isMyLog ? 'text-slate-100 font-semibold' : 'text-slate-300'}>
                               님이 [{t.itemTitle}] 사용 완료 (대상: {t.usedTarget || '없음'})
                            </span>
                          </span>
                        </div>
                        
                        <div className="flex items-center gap-3">
                          <span className="text-slate-400 font-mono text-[11px]">{t.useDate}</span>
                          {currentUser?.role === 'admin' && (
                            <button 
                              onClick={() => handleDeleteLog(t.id)}
                              className="px-2 py-0.5 rounded bg-rose-950 text-rose-300 hover:bg-rose-900 text-[10px] font-bold border border-rose-800"
                            >
                              삭제
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
              </div>
            )}

            {/* [개인 보관함 & 개인 마일리지 내역 탭] */}
            {activeTab === 'inventory' && currentUser && (
              <div className="space-y-6">
                {/* 1. 보유 아이템 보관함 */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                  <h3 className="font-bold text-amber-400">🎁 내 아이템 보관함</h3>
                  {myPurchasedItems.length === 0 ? (
                    <p className="text-xs text-slate-500 py-4">보유 중인 아이템이 없습니다. 상점에서 필요한 아이템을 구매해 보세요!</p>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {myPurchasedItems.map(item => (
                        <div key={item.id} className="p-4 bg-slate-950 rounded-2xl border border-slate-800">
                          <h4 className="font-bold text-slate-200">{item.itemTitle}</h4>
                          <button onClick={() => setSelectedItemForUse(item)} disabled={item.used} className={`w-full mt-4 py-2 rounded-xl text-xs font-bold ${item.used ? 'bg-slate-800 text-slate-500' : 'bg-amber-400 text-slate-950'}`}>
                            {item.used ? '사용 완료됨' : '⚡ 사용하기'}
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* 2. 내 개인 마일리지 획득 & 사용 전체 기록 (본인 전용) */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-cyan-400">📜 내 마일리지 적립 & 사용 내역 (개인 전용)</h3>
                    <span className="text-xs font-mono text-slate-400">현재 잔여: <strong className="text-cyan-400">{currentUser.points.toLocaleString()} pt</strong></span>
                  </div>

                  <div className="space-y-2">
                    {myPersonalHistory.length === 0 ? (
                      <p className="text-xs text-slate-500 py-4">마일리지 적립/사용 내역이 없습니다.</p>
                    ) : (
                      [...myPersonalHistory]
                        .sort((a, b) => b.timestamp - a.timestamp)
                        .map(h => {
                          const isEarn = h.type === 'CHECKIN' || h.type === 'EARN' || (h.type === 'ADMIN_GRANT' && h.amount > 0);
                          return (
                            <div key={h.id} className="p-3 bg-slate-950 rounded-xl border border-slate-800/80 text-xs flex justify-between items-center">
                              <div>
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold mr-2 ${
                                  isEarn ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-rose-950 text-rose-300 border border-rose-800'
                                }`}>
                                  {isEarn ? '적립' : '차감/구매'}
                                </span>
                                <span className="font-bold text-slate-200">{h.itemTitle}</span>
                              </div>
                              <div className="flex items-center gap-4">
                                <span className={`font-mono font-black ${isEarn ? 'text-emerald-400' : 'text-rose-400'}`}>
                                  {isEarn ? `+${h.amount?.toLocaleString() || 100} pt` : `-${h.amount?.toLocaleString() || 0} pt`}
                                </span>
                                <span className="text-slate-500 text-[11px] font-mono">{h.date}</span>
                              </div>
                            </div>
                          );
                        })
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'admin' && currentUser?.role === 'admin' && (
              <div className="space-y-6">
                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                  <h3 className="font-bold text-purple-400">👑 관리자 제어판</h3>
                  <div className="flex gap-4">
                    <button onClick={() => setShowAddBattleModal(true)} className="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold text-xs">+ 교체혈전 일정 추가</button>
                    <button onClick={() => setShowAddItemModal(true)} className="px-4 py-2 rounded-xl bg-purple-600 text-white font-bold text-xs">+ 상점 상품 추가</button>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 mt-4">
                    <h4 className="font-bold text-cyan-400 text-xs">⚡ 클럽원 마일리지 수동 지급 / 차감</h4>
                    <form onSubmit={async (e) => {
                      e.preventDefault();
                      const amountNum = parseInt(adminGrantForm.amount, 10);
                      if (!Number.isInteger(amountNum) || amountNum === 0) { showToast('올바른 마일리지 금액을 입력해주세요.', 'error'); return; }
                      const { error } = await supabase.rpc('admin_adjust_points', { p_user_id: adminGrantForm.targetUserId, p_amount: amountNum, p_reason: adminGrantForm.reason || (amountNum > 0 ? '관리자 마일리지 지급' : '관리자 마일리지 차감') });
                      if (error) { showToast('마일리지 변경 실패: ' + error.message, 'error'); return; }
                      setAdminGrantForm({ targetUserId: '', amount: '', reason: '' }); await refreshData(); showToast('마일리지 변경 완료!', 'success');
                    }} className="space-y-2 text-xs">
                      <select
                        value={adminGrantForm.targetUserId}
                        onChange={e => setAdminGrantForm({...adminGrantForm, targetUserId: e.target.value})}
                        required
                        className="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                      >
                        <option value="">-- 대상 회원 선택 --</option>
                        {users.map(u => (
                          <option key={u.id} value={u.id}>{u.name} (@{u.username})</option>
                        ))}
                      </select>
                      <input
                        type="number"
                        placeholder="지급/차감할 포인트 (예: 5000 또는 -2000)"
                        required
                        value={adminGrantForm.amount}
                        onChange={e => setAdminGrantForm({...adminGrantForm, amount: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                      />
                      <input
                        type="text"
                        placeholder="사유 (예: 내전 승리 보상)"
                        value={adminGrantForm.reason}
                        onChange={e => setAdminGrantForm({...adminGrantForm, reason: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                      />
                      <button type="submit" className="w-full py-2.5 bg-purple-600 text-white font-bold rounded-xl">마일리지 반영하기</button>
                    </form>
                  </div>
                </div>

                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                  <h3 className="font-bold text-cyan-400">👤 등록된 회원 계정 목록 및 관리</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-500">
                          <th className="py-2 px-3">이름/아이디</th>
                          <th className="py-2 px-3">권한</th>
                          <th className="py-2 px-3">마일리지</th>
                          <th className="py-2 px-3 text-right">계정 관리</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {users.map(u => (
                          <tr key={u.id}>
                            <td className="py-2.5 px-3">
                              <span className="font-bold block text-slate-200">{u.name}</span>
                              <span className="text-[10px] text-slate-500">@{u.username}</span>
                            </td>
                            <td className="py-2.5 px-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] ${u.role === 'admin' ? 'bg-purple-900 text-purple-200' : 'bg-slate-800 text-slate-400'}`}>
                                {u.role === 'admin' ? '관리자' : '회원'}
                              </span>
                            </td>
                            <td className="py-2.5 px-3 font-mono text-cyan-400 font-bold">{u.points.toLocaleString()} pt</td>
                            <td className="py-2.5 px-3 text-right">
                              {u.role !== 'admin' && (
                                <button 
                                  onClick={() => handleDeleteUser(u.id, u.name)}
                                  className="px-2.5 py-1 rounded bg-rose-950 text-rose-300 hover:bg-rose-900 text-[11px] font-bold border border-rose-800"
                                >
                                  계정 삭제
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* EDIT BATTLE RESULT MODAL */}
          {selectedBattleForEdit && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 text-xs">
                <h3 className="font-bold text-rose-400 text-sm">⚔️ 교체혈전 결과 입력</h3>
                <p className="text-slate-400">경기: <strong className="text-slate-200">{selectedBattleForEdit.challenger} vs {selectedBattleForEdit.defender}</strong></p>
                
                <form onSubmit={handleUpdateBattleResult} className="space-y-3">
                  <div>
                    <label className="block text-slate-400 mb-1">승자 (Winner)</label>
                    <select 
                      value={battleResultForm.winner} 
                      onChange={e => setBattleResultForm({...battleResultForm, winner: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                    >
                      <option value={selectedBattleForEdit.challenger}>{selectedBattleForEdit.challenger}</option>
                      <option value={selectedBattleForEdit.defender}>{selectedBattleForEdit.defender}</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">패자 (Loser)</label>
                    <select 
                      value={battleResultForm.loser} 
                      onChange={e => setBattleResultForm({...battleResultForm, loser: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                    >
                      <option value={selectedBattleForEdit.defender}>{selectedBattleForEdit.defender}</option>
                      <option value={selectedBattleForEdit.challenger}>{selectedBattleForEdit.challenger}</option>
                    </select>
                  </div>

                  <button type="submit" className="w-full py-3 bg-rose-600 text-white font-bold rounded-xl">결과 저장 완료</button>
                </form>

                <button onClick={() => setSelectedBattleForEdit(null)} className="w-full text-slate-500 text-center">취소</button>
              </div>
            </div>
          )}

          {/* PURCHASE MODAL */}
          {selectedItemForPurchase && currentUser && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4">
                <h3 className="font-bold text-slate-100">{selectedItemForPurchase.title} 구매</h3>
                <p className="text-xs text-slate-400">차감 마일리지: {selectedItemForPurchase.price} pt</p>
                <button onClick={handlePurchase} className="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs">구매 확정</button>
                <button onClick={() => setSelectedItemForPurchase(null)} className="w-full text-xs text-slate-500">취소</button>
              </div>
            </div>
          )}

          {/* USE ITEM MODAL */}
          {selectedItemForUse && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4">
                <h3 className="font-bold text-slate-100">{selectedItemForUse.itemTitle} 사용</h3>
                
                {(selectedItemForUse.itemTitle.includes('신청권') || selectedItemForUse.itemTitle.includes('공격권')) && (
                  <select value={targetUserForUse} onChange={(e) => setTargetUserForUse(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-100">
                    <option value="">-- 대상 선택 --</option>
                    {users.filter(u => u.id !== currentUser?.id).map(u => (
                      <option key={u.id} value={u.name}>{u.name}</option>
                    ))}
                  </select>
                )}

                {selectedItemForUse.itemTitle.includes('방어권') && (
                  <select value={targetUserForUse} onChange={(e) => setTargetUserForUse(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-100">
                    <option value="">-- 나를 지목한 공격자 선택 --</option>
                    {getAttackersTargetingMe().length > 0 ? (
                      getAttackersTargetingMe().map(name => (
                        <option key={name} value={name}>{name}</option>
                      ))
                    ) : (
                      <option value="" disabled>현재 나를 공격한 회원이 없습니다</option>
                    )}
                  </select>
                )}
                
                <button onClick={handleUseItem} className="w-full py-3 bg-amber-400 text-slate-950 font-bold rounded-xl text-xs">⚡ 아이템 사용하기</button>
                <button onClick={() => { setSelectedItemForUse(null); setTargetUserForUse(''); }} className="w-full text-xs text-slate-500">취소</button>
              </div>
            </div>
          )}

          {/* ADD BATTLE MODAL */}
          {showAddBattleModal && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-3 text-xs">
                <h3 className="font-bold text-rose-400 text-sm">교체혈전 일정 추가</h3>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  if (!newBattleForm.challenger || !newBattleForm.defender) return;
                  const { error } = await supabase.rpc('admin_add_battle', { p_challenger:newBattleForm.challenger, p_defender:newBattleForm.defender, p_battle_date:newBattleForm.battleDate || new Date().toISOString().slice(0,10), p_note:newBattleForm.note || '교체혈전 경기' });
                  if (error) { showToast('일정 등록 실패: '+error.message, 'error'); return; }
                  setShowAddBattleModal(false); setNewBattleForm({ challenger:'', defender:'', battleDate:'', note:'' }); await refreshData(); showToast('교체혈전 일정이 등록되었습니다!', 'success');
                }} className="space-y-3">
                  <input type="text" placeholder="도전자" required value={newBattleForm.challenger} onChange={e => setNewBattleForm({...newBattleForm, challenger: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl" />
                  <input type="text" placeholder="방어자" required value={newBattleForm.defender} onChange={e => setNewBattleForm({...newBattleForm, defender: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl" />
                  <input type="date" required value={newBattleForm.battleDate} onChange={e => setNewBattleForm({...newBattleForm, battleDate: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl" />
                  <button type="submit" className="w-full py-3 bg-rose-600 text-white font-bold rounded-xl">일정 등록</button>
                </form>
                <button onClick={() => setShowAddBattleModal(false)} className="w-full text-slate-500">취소</button>
              </div>
            </div>
          )}

          {/* ADD ITEM MODAL */}
          {showAddItemModal && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-3 text-xs">
                <h3 className="font-bold text-purple-400 text-sm">신규 상품 추가</h3>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  if (!newItemForm.title || !newItemForm.price) return;
                  const { error } = await supabase.rpc('admin_add_product', { p_title:newItemForm.title, p_category:newItemForm.category, p_price:parseInt(newItemForm.price,10), p_stock:parseInt(newItemForm.stock,10)||99, p_icon:newItemForm.icon||'🎁', p_description:newItemForm.description||'', p_tag:newItemForm.tag||'신규' });
                  if (error) { showToast('상품 등록 실패: '+error.message, 'error'); return; }
                  setShowAddItemModal(false); setNewItemForm({ title:'', category:'게임 아이템', price:'', stock:'', icon:'🎁', description:'', tag:'' }); await refreshData(); showToast('새 상품이 등록되었습니다!', 'success');
                }} className="space-y-3">
                  <input type="text" placeholder="상품명" required value={newItemForm.title} onChange={e => setNewItemForm({...newItemForm, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl" />
                  <input type="number" placeholder="필요 마일리지" required value={newItemForm.price} onChange={e => setNewItemForm({...newItemForm, price: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl" />
                  <textarea placeholder="설명" value={newItemForm.description} onChange={e => setNewItemForm({...newItemForm, description: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl" />
                  <button type="submit" className="w-full py-3 bg-purple-600 text-white font-bold rounded-xl">상품 추가</button>
                </form>
                <button onClick={() => setShowAddItemModal(false)} className="w-full text-slate-500">취소</button>
              </div>
            </div>
          )}

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4">
                <h3 className="font-bold text-center text-slate-100">{authMode === 'login' ? '로그인' : '회원가입'}</h3>
                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  <input type="text" placeholder="아이디" required value={authForm.username} onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                  {authMode === 'signup' && (
                    <input type="text" placeholder="이름/닉네임" required value={authForm.name} onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                  )}
                  <input type="password" placeholder="비밀번호" required value={authForm.password} onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                  <button type="submit" className="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl">확인</button>
                </form>
                <button onClick={() => setShowAuthModal(false)} className="w-full text-center text-xs text-slate-500">닫기</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
