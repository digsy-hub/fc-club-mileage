<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA Club Mileage Store</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 도트/픽셀 폰트 (Galmuri9, Press Start 2P) 추가 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ungoldman/galmuri/galmuri.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body { margin: 0; padding: 0; background-color: #020617; font-family: 'Pretendard', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 도트 폰트 클래스 */
    .font-pixel {
      font-family: 'Galmuri9', 'Press Start 2P', monospace;
      letter-spacing: 2px;
    }

    /* 전광판 슬라이드 애니메이션 (영상의 차분하고 여유 있는 속도 반영: 28초) */
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 28s linear infinite;
    }

    /* LED 전광판 도트 격자 배경 효과 */
    .led-bg-pattern {
      background-color: #050b14;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px),
        radial-gradient(rgba(0, 0, 0, 0.8) 1.5px, #030712 1.5px);
      background-size: 6px 6px;
      background-position: 0 0, 3px 3px;
    }

    /* 전광판 글자 글로우(발광) 효과 */
    .led-text-glow {
      text-shadow: 0 0 8px currentColor, 0 0 16px currentColor;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://hhjqwbvxigjobkdlabor.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NclsaKLTsNstArrEkVRIiA_knj5G4Mi';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const COLOR_OPTIONS = [
      { id: 'yellow', label: '옐로우', value: '#facc15' },
      { id: 'cyan', label: '시안', value: '#38bdf8' },
      { id: 'red', label: '레드', value: '#f87171' },
      { id: 'green', label: '그린', value: '#4ade80' },
      { id: 'orange', label: '오렌지', value: '#fb923c' },
      { id: 'purple', label: '퍼플', value: '#c084fc' },
      { id: 'pink', label: '핑크', value: '#f472b6' },
      { id: 'white', label: '화이트', value: '#ffffff' }
    ];

    function App() {
      const [users, setUsers] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [items, setItems] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [battles, setBattles] = useState([]);
      const [bets, setBets] = useState([]);
      const [billboards, setBillboards] = useState([]);
      const [loadingData, setLoadingData] = useState(true);

      const mapProfile = p => {
        let titleObj = null;
        if (p.title_badge) {
          try {
            titleObj = typeof p.title_badge === 'string' && p.title_badge.startsWith('{') 
              ? JSON.parse(p.title_badge) 
              : { name: p.title_badge, icon: '👑', color: 'from-amber-500 to-amber-600 text-slate-950' };
          } catch(e) {
            titleObj = { name: p.title_badge, icon: '👑', color: 'from-amber-500 to-amber-600 text-slate-950' };
          }
        }

        let titleList = [];
        if (p.titles) {
          try {
            titleList = typeof p.titles === 'string' ? JSON.parse(p.titles) : p.titles;
          } catch(e) { titleList = []; }
        }

        return { 
          id: p.id, 
          username: p.username, 
          name: p.display_name, 
          role: p.role, 
          points: p.points,
          avatarUrl: p.avatar_url || '',
          bgUrl: p.bg_url || '',
          statusMsg: p.status_msg || '',
          winnerQuote: p.winner_quote || '',
          titleBadge: titleObj,
          titles: Array.isArray(titleList) ? titleList : []
        };
      };
      
      const mapProduct = p => ({ id:p.id, title:p.title, category:p.category, price:p.price, stock:p.stock, icon:p.icon, description:p.description, tag:p.tag });
      
      const mapTransaction = t => {
        const useTime = t.use_date ? new Date(t.use_date).getTime() : 0;
        const createTime = new Date(t.created_at).getTime() || 0;
        return { 
          id: t.id, 
          userId: t.user_id, 
          userName: t.user_name, 
          type: t.type, 
          amount: t.amount, 
          itemTitle: t.item_title, 
          status: t.status, 
          used: t.used, 
          usedTarget: t.used_target, 
          useDate: t.use_date ? new Date(t.use_date).toLocaleString('ko-KR') : '', 
          date: new Date(t.created_at).toLocaleString('ko-KR'), 
          timestamp: createTime,
          useTimestamp: useTime || createTime
        };
      };
      
      const mapBattle = b => ({ 
        id: b.id, 
        challenger: b.challenger, 
        defender: b.defender, 
        battleDate: b.battle_date, 
        status: b.status, 
        winner: b.winner, 
        loser: b.loser, 
        winnerComment: b.winner_comment || '',
        note: b.note 
      });

      const refreshData = async () => {
        setLoadingData(true);
        const [pr, ur, tr, br, ber, bir] = await Promise.all([
          supabase.from('products').select('*').eq('active', true).order('id', { ascending: true }),
          supabase.from('profiles').select('*').order('created_at'),
          supabase.from('transactions').select('*').order('created_at', { ascending: false }).limit(500),
          supabase.from('battles').select('*').order('battle_date', {ascending:false}),
          supabase.from('bets').select('*'),
          supabase.from('billboards').select('*').order('created_at', { ascending: false }).limit(5)
        ]);
        const err = pr.error || ur.error || tr.error || br.error || ber.error || bir.error;
        if (err) showToast('데이터 불러오기 실패: ' + err.message, 'error');
        setItems((pr.data||[]).map(mapProduct)); setUsers((ur.data||[]).map(mapProfile));
        setTransactions((tr.data||[]).map(mapTransaction)); setBattles((br.data||[]).map(mapBattle));
        setBets(ber.data || []);
        setBillboards(bir.data || []);
        setLoadingData(false);
      };

      const loadSession = async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) await loadCurrentProfile(session.user.id);
        await refreshData();
      };

      const loadCurrentProfile = async (id) => {
        const { data, error } = await supabase.from('profiles').select('*').eq('id', id).single();
        if (!error && data) setCurrentUser(mapProfile(data));
      };

      useEffect(() => {
        loadSession();
        const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
          if (!session) setCurrentUser(null);
          else setTimeout(() => loadCurrentProfile(session.user.id), 0);
        });
        return () => listener.subscription.unsubscribe();
      }, []);

      const [activeTab, setActiveTab] = useState('store');
      const [inventorySubTab, setInventorySubTab] = useState('items');
      const [selectedCategory, setSelectedCategory] = useState('전체');
      const [searchQuery, setSearchQuery] = useState('');

      const [selectedItemForPurchase, setSelectedItemForPurchase] = useState(null);
      const [selectedItemForUse, setSelectedItemForUse] = useState(null);
      const [targetUserForUse, setTargetUserForUse] = useState('');
      const [showAddItemModal, setShowAddItemModal] = useState(false);
      const [showAddBattleModal, setShowAddBattleModal] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showProfileModal, setShowProfileModal] = useState(false);
      
      const [selectedBattleForEdit, setSelectedBattleForEdit] = useState(null);
      const [battleResultForm, setBattleResultForm] = useState({ winner: '', loser: '' });

      const [selectedBattleForBet, setSelectedBattleForBet] = useState(null);
      const [betTargetPlayer, setBetTargetPlayer] = useState('');
      const [betAmount, setBetAmount] = useState('');

      const [billboardForm, setBillboardForm] = useState({ message: '', color: '#facc15' });
      const [currentBillboardIdx, setCurrentBillboardIdx] = useState(0);

      useEffect(() => {
        if (billboards.length <= 1) return;
        const interval = setInterval(() => {
          setCurrentBillboardIdx(prev => (prev + 1) % billboards.length);
        }, 7000);
        return () => clearInterval(interval);
      }, [billboards]);

      const [authMode, setAuthMode] = useState('login');
      const [toastMessage, setToastMessage] = useState(null);

      const [profileForm, setProfileForm] = useState({ avatarUrl: '', bgUrl: '', statusMsg: '', winnerQuote: '' });
      const [adminTitleForm, setAdminTitleForm] = useState({ 
        targetUserId: '', 
        titleName: '', 
        icon: '👑', 
        color: COLOR_OPTIONS[0].value 
      });

      const [adminGrantForm, setAdminGrantForm] = useState({ targetUserId: '', amount: '', reason: '' });
      const [newItemForm, setNewItemForm] = useState({ title: '', category: '게임 아이템', price: '', stock: '', icon: '🎁', description: '', tag: '' });
      const [newBattleForm, setNewBattleForm] = useState({ challenger: '', defender: '', battleDate: '', note: '' });
      const [authForm, setAuthForm] = useState({ username: '', name: '', password: '' });

      const showToast = (msg, type = 'info') => {
        setToastMessage({ text: msg, type });
        setTimeout(() => setToastMessage(null), 3000);
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        const username = authForm.username.trim();
        if (!username) { showToast('아이디를 입력해 주세요.', 'error'); return; }

        const email = `${username}@fc-club-mileage.invalid`;
        
        if (authMode === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password: authForm.password });
          if (error) { showToast('로그인 실패: 아이디 또는 비밀번호를 확인해 주세요.', 'error'); return; }
          const { data: { user } } = await supabase.auth.getUser();
          await loadCurrentProfile(user.id); await refreshData(); setShowAuthModal(false);
          setAuthForm({ username:'', name:'', password:'' }); showToast('로그인되었습니다.', 'success');
        } else {
          if (!authForm.name.trim()) { showToast('이름을 입력해 주세요.', 'error'); return; }
          const { data, error } = await supabase.auth.signUp({ 
            email, 
            password: authForm.password, 
            options:{ data:{ username, display_name:authForm.name.trim() } } 
          });
          if (error) { showToast('회원가입 실패: ' + error.message, 'error'); return; }
          await loadCurrentProfile(data.user.id); await refreshData(); setShowAuthModal(false);
          setAuthForm({ username:'', name:'', password:'' }); showToast('가입 완료! 1,000pt가 지급되었습니다.', 'success');
        }
      };

      const handleLogout = async () => { await supabase.auth.signOut(); setCurrentUser(null); setActiveTab('store'); showToast('로그아웃 되었습니다.', 'info'); };

      const handleDailyCheckIn = async () => {
        if (!currentUser) return;
        const { error } = await supabase.rpc('check_in_daily');
        if (error) {
          showToast(error.message, 'error');
          return;
        }
        await refreshData();
        await loadCurrentProfile(currentUser.id);
        showToast('🎉 출석체크 완료! 100pt가 적립되었습니다.', 'success');
      };

      const handleImageUpload = (e, field) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          showToast('이미지 용량은 2MB 이하만 가능합니다.', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          setProfileForm(prev => ({ ...prev, [field]: uploadEvent.target.result }));
          showToast('이미지가 첨부되었습니다. [프로필 저장 완료]를 눌러주세요!', 'info');
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        const { error } = await supabase
          .from('profiles')
          .update({
            avatar_url: profileForm.avatarUrl,
            bg_url: profileForm.bgUrl,
            status_msg: profileForm.statusMsg,
            winner_quote: profileForm.winnerQuote
          })
          .eq('id', currentUser.id);

        if (error) {
          showToast('프로필 수정 실패: ' + error.message, 'error');
          return;
        }

        await loadCurrentProfile(currentUser.id);
        await refreshData();
        setShowProfileModal(false);
        showToast('프로필이 업데이트되었습니다!', 'success');
      };

      const handleAdminGrantTitle = async (e) => {
        e.preventDefault();
        if (!adminTitleForm.targetUserId || !adminTitleForm.titleName.trim()) {
          showToast('대상과 칭호 이름을 모두 입력해주세요.', 'error');
          return;
        }

        const { error } = await supabase.rpc('admin_grant_title', {
          p_user_id: adminTitleForm.targetUserId,
          p_title_name: adminTitleForm.titleName.trim(),
          p_icon: adminTitleForm.icon || '👑',
          p_color: adminTitleForm.color
        });

        if (error) {
          showToast('칭호 부여 실패: ' + error.message, 'error');
          return;
        }

        setAdminTitleForm({ targetUserId: '', titleName: '', icon: '👑', color: COLOR_OPTIONS[0].value });
        await refreshData();
        showToast('칭호가 성공적으로 수여되었습니다!', 'success');
      };

      const handleEquipTitle = async (titleObjToEquip) => {
        if (!currentUser) return;
        const titleBadgeValue = titleObjToEquip ? JSON.stringify(titleObjToEquip) : null;
        const { error } = await supabase.from('profiles').update({ title_badge: titleBadgeValue }).eq('id', currentUser.id);
        if (error) { showToast('칭호 변경 실패: ' + error.message, 'error'); return; }
        await loadCurrentProfile(currentUser.id);
        await refreshData();
        showToast(titleObjToEquip ? `'${titleObjToEquip.name}' 칭호를 장착했습니다!` : '칭호를 해제했습니다.', 'success');
      };

      const handlePlaceBetSubmit = async (e) => {
        e.preventDefault();
        if (!selectedBattleForBet || !currentUser) return;
        const amountNum = parseInt(betAmount, 10);
        if (!Number.isInteger(amountNum) || amountNum <= 0) {
          showToast('올바른 배팅 금액을 입력해주세요.', 'error');
          return;
        }
        if (currentUser.points < amountNum) {
          showToast('보유 마일리지가 부족합니다.', 'error');
          return;
        }

        const { error } = await supabase.rpc('place_bet', {
          p_battle_id: String(selectedBattleForBet.id),
          p_target_player: betTargetPlayer,
          p_amount: amountNum
        });

        if (error) {
          showToast('배팅 실패: ' + error.message, 'error');
          return;
        }

        setSelectedBattleForBet(null);
        setBetAmount('');
        setBetTargetPlayer('');
        await refreshData();
        await loadCurrentProfile(currentUser.id);
        showToast(`🎯 '${betTargetPlayer}' 선수에게 ${amountNum.toLocaleString()} pt 배팅 완료!`, 'success');
      };

      const handleBillboardSubmit = async (e) => {
        e.preventDefault();
        if (!currentUser) {
          setAuthMode('login');
          setShowAuthModal(true);
          return;
        }
        const msg = billboardForm.message.trim();
        if (!msg) {
          showToast('등록할 문구를 입력해주세요.', 'error');
          return;
        }
        if (msg.length > 20) {
          showToast('문구는 최대 20자까지만 입력 가능합니다.', 'error');
          return;
        }

        const { error: insError } = await supabase.from('billboards').insert({
          user_id: currentUser.id,
          user_name: currentUser.name,
          message: msg,
          color: billboardForm.color
        });

        if (insError) {
          showToast('전광판 등록 실패: ' + insError.message, 'error');
          return;
        }

        setBillboardForm({ message: '', color: '#facc15' });
        await refreshData();
        showToast('✨ 전광판에 문구가 성공적으로 등록되었습니다!', 'success');
      };

      const handleDeleteBillboard = async (id) => {
        if (!confirm('이 전광판 문구를 삭제하시겠습니까?')) return;
        const { error } = await supabase.from('billboards').delete().eq('id', id);
        if (error) {
          showToast('삭제 실패: ' + error.message, 'error');
          return;
        }
        await refreshData();
        showToast('전광판 문구가 삭제되었습니다.', 'info');
      };

      const handlePurchase = async () => {
        if (!selectedItemForPurchase || !currentUser) return;
        const { error } = await supabase.rpc('purchase_product', { p_product_id: selectedItemForPurchase.id });
        if (error) { showToast('구매 실패: ' + error.message, 'error'); return; }
        setSelectedItemForPurchase(null); await refreshData(); await loadCurrentProfile(currentUser.id); showToast(`'${selectedItemForPurchase.title}' 구매 완료!`, 'success');
      };

      const handleUseItem = async () => {
        if (!selectedItemForUse || !currentUser) return;
        const tx = selectedItemForUse;
        const needsTarget = tx.itemTitle.includes('신청권') || tx.itemTitle.includes('공격권') || tx.itemTitle.includes('방어권');
        if (needsTarget && !targetUserForUse) { showToast('사용 대상을 선택해 주세요.', 'error'); return; }
        const { error } = await supabase.rpc('use_purchased_item', { p_transaction_id: tx.id, p_target: targetUserForUse || null });
        if (error) { showToast('아이템 사용 실패: ' + error.message, 'error'); return; }
        setSelectedItemForUse(null); setTargetUserForUse(''); await refreshData(); showToast('아이템 사용 완료!', 'success');
      };

      const handleDeleteUser = async (targetUserId, targetUserName) => {
        if (!confirm(`정말 '${targetUserName}' 회원을 삭제하시겠습니까?`)) return;
        const { error } = await supabase.from('profiles').delete().eq('id', targetUserId);
        if (error) { showToast('회원 삭제 실패: ' + error.message, 'error'); return; }
        await refreshData();
        showToast(`'${targetUserName}' 회원이 삭제되었습니다.`, 'success');
      };

      const handleDeleteLog = async (logId) => {
        if (!confirm('이 활동 로그를 삭제하시겠습니까?')) return;
        const { error } = await supabase.from('transactions').delete().eq('id', logId);
        if (error) { showToast('로그 삭제 실패: ' + error.message, 'error'); return; }
        await refreshData();
        showToast('활동 로그가 삭제되었습니다.', 'success');
      };

      const handleUpdateBattleResult = async (e) => {
        e.preventDefault();
        if (!selectedBattleForEdit) return;
        if (!battleResultForm.winner || !battleResultForm.loser) {
          showToast('승자와 패자를 모두 선택해주세요.', 'error');
          return;
        }
        if (battleResultForm.winner === battleResultForm.loser) {
          showToast('승자와 패자는 동일할 수 없습니다.', 'error');
          return;
        }

        const { error } = await supabase.rpc('admin_update_battle_result', {
          p_battle_id: String(selectedBattleForEdit.id),
          p_winner: battleResultForm.winner,
          p_loser: battleResultForm.loser
        });

        if (error) {
          showToast('경기 결과 수정 실패: ' + error.message, 'error');
          return;
        }

        setSelectedBattleForEdit(null);
        setBattleResultForm({ winner: '', loser: '' });
        await refreshData();
        if (currentUser) await loadCurrentProfile(currentUser.id);
        showToast('교체혈전 결과 확정 및 토토 정산이 완료되었습니다!', 'success');
      };

      const getAttackersTargetingMe = () => {
        if (!currentUser) return [];
        const attackerNames = transactions
          .filter(t => t.used && (t.itemTitle.includes('신청권') || t.itemTitle.includes('공격권')))
          .filter(t => t.usedTarget === currentUser.name || t.usedTarget === currentUser.username || t.itemTitle.includes(`대상: ${currentUser.name}`))
          .map(t => t.userName);
        return [...new Set(attackerNames)];
      };

      const getUserByNameOrUsername = (nameOrUsername) => {
        return users.find(u => u.name === nameOrUsername || u.username === nameOrUsername);
      };

      const filteredItems = items.filter(item => {
        const matchesCategory = selectedCategory === '전체' || item.category === selectedCategory;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const myPurchasedItems = currentUser 
        ? transactions.filter(t => 
            t.userId === currentUser.id && 
            t.type === 'SPEND' && 
            t.status === 'COMPLETED' &&
            !t.itemTitle.includes('교체혈전 승부예측 배팅')
          )
        : [];

      const myPersonalHistory = currentUser
        ? transactions.filter(t => t.userId === currentUser.id)
        : [];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-20">
          {toastMessage && (

                              {u.role !== 'admin' && (
                                <button 
                                  onClick={() => handleDeleteUser(u.id, u.name)}
                                  className="px-2.5 py-1 rounded bg-rose-950 text-rose-300 hover:bg-rose-900 text-[11px] font-bold border border-rose-800"
                                >
                                  계정 삭제
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 토토 배팅 모달 */}
          {selectedBattleForBet && currentUser && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 text-xs">
                <h3 className="font-bold text-amber-400 text-sm">💰 교체혈전 승부예측 배팅</h3>
                <p className="text-slate-400">경기: <strong className="text-slate-200">{selectedBattleForBet.challenger} vs {selectedBattleForBet.defender}</strong></p>
                <p className="text-slate-400">보유 잔액: <strong className="text-cyan-400">{currentUser.points.toLocaleString()} pt</strong></p>
                
                <form onSubmit={handlePlaceBetSubmit} className="space-y-3">
                  <div>
                    <label className="block text-slate-400 mb-1">승리예측 선수 선택</label>
                    <select 
                      value={betTargetPlayer} 
                      onChange={e => setBetTargetPlayer(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                    >
                      <option value={selectedBattleForBet.challenger}>도전자: {selectedBattleForBet.challenger}</option>
                      <option value={selectedBattleForBet.defender}>방어자: {selectedBattleForBet.defender}</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">배팅할 마일리지 (pt)</label>
                    <input 
                      type="number" 
                      placeholder="예: 1000" 
                      required 
                      min="100"
                      max={currentUser.points}
                      value={betAmount}
                      onChange={e => setBetAmount(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100 font-mono"
                    />
                  </div>

                  <button type="submit" className="w-full py-3 bg-amber-500 text-slate-950 font-black rounded-xl hover:brightness-110">
                    배팅 확정하기
                  </button>
                </form>

                <button onClick={() => setSelectedBattleForBet(null)} className="w-full text-slate-500 text-center">취소</button>
              </div>
            </div>
          )}

          {/* PROFILE EDIT MODAL */}
          {showProfileModal && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 text-xs">
                <h3 className="font-bold text-cyan-400 text-sm">👤 프로필 꾸미기</h3>
                
                <form onSubmit={handleSaveProfile} className="space-y-3">
                  <div>
                    <label className="block text-slate-400 mb-1">프로필 이미지 파일 선택</label>
                    <input 
                      type="file" 
                      accept="image/*"
                      onChange={e => handleImageUpload(e, 'avatarUrl')}
                      className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-slate-300 text-[11px] file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cyan-500 file:text-slate-950 hover:file:bg-cyan-400 cursor-pointer"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">배경 커버 이미지 파일 선택</label>
                    <input 
                      type="file" 
                      accept="image/*"
                      onChange={e => handleImageUpload(e, 'bgUrl')}
                      className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-slate-300 text-[11px] file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cyan-500 file:text-slate-950 hover:file:bg-cyan-400 cursor-pointer"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">상태 메시지</label>
                    <input 
                      type="text" 
                      placeholder="한 줄 소개글을 적어주세요!" 
                      maxLength="40"
                      value={profileForm.statusMsg}
                      onChange={e => setProfileForm({...profileForm, statusMsg: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">🏆 승자의 한마디 (교체혈전 승리 시 공지에 표시)</label>
                    <input 
                      type="text" 
                      placeholder="예: 상도덕이 없네요. 쌉가능." 
                      maxLength="50"
                      value={profileForm.winnerQuote}
                      onChange={e => setProfileForm({...profileForm, winnerQuote: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                    />
                  </div>

                  <button type="submit" className="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl">프로필 저장 완료</button>
                </form>

                <button onClick={() => setShowProfileModal(false)} className="w-full text-slate-500 text-center">취소</button>
              </div>
            </div>
          )}

          {/* EDIT BATTLE RESULT MODAL */}
          {selectedBattleForEdit && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 text-xs">
                <h3 className="font-bold text-rose-400 text-sm">⚔️ 교체혈전 결과 입력 & 토토 정산</h3>
                <p className="text-slate-400">경기: <strong className="text-slate-200">{selectedBattleForEdit.challenger} vs {selectedBattleForEdit.defender}</strong></p>
                
                <form onSubmit={handleUpdateBattleResult} className="space-y-3">
                  <div>
                    <label className="block text-slate-400 mb-1">승자 (Winner)</label>
                    <select 
                      value={battleResultForm.winner} 
                      onChange={e => setBattleResultForm({...battleResultForm, winner: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                    >
                      <option value={selectedBattleForEdit.challenger}>{selectedBattleForEdit.challenger}</option>
                      <option value={selectedBattleForEdit.defender}>{selectedBattleForEdit.defender}</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">패자 (Loser)</label>
                    <select 
                      value={battleResultForm.loser} 
                      onChange={e => setBattleResultForm({...battleResultForm, loser: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                    >
                      <option value={selectedBattleForEdit.defender}>{selectedBattleForEdit.defender}</option>
                      <option value={selectedBattleForEdit.challenger}>{selectedBattleForEdit.challenger}</option>
                    </select>
                  </div>

                  <button type="submit" className="w-full py-3 bg-rose-600 text-white font-bold rounded-xl">결과 확정 및 토토 정산 실행</button>
                </form>

                <button onClick={() => setSelectedBattleForEdit(null)} className="w-full text-slate-500 text-center">취소</button>
              </div>
            </div>
          )}

          {/* ADD BATTLE MODAL */}
          {showAddBattleModal && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-3 text-xs">
                <h3 className="font-bold text-rose-400 text-sm">교체혈전 일정 추가</h3>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  if (!newBattleForm.challenger || !newBattleForm.defender) {
                    showToast('도전자와 방어자를 모두 선택해주세요.', 'error');
                    return;
                  }
                  if (newBattleForm.challenger === newBattleForm.defender) {
                    showToast('도전자와 방어자는 동일할 수 없습니다.', 'error');
                    return;
                  }
                  const { error } = await supabase.rpc('admin_add_battle', { p_challenger:newBattleForm.challenger, p_defender:newBattleForm.defender, p_battle_date:newBattleForm.battleDate || new Date().toISOString().slice(0,10), p_note:newBattleForm.note || '교체혈전 경기' });
                  if (error) { showToast('일정 등록 실패: '+error.message, 'error'); return; }
                  setShowAddBattleModal(false); setNewBattleForm({ challenger:'', defender:'', battleDate:'', note:'' }); await refreshData(); showToast('교체혈전 일정이 등록되었습니다!', 'success');
                }} className="space-y-3">
                  <div>
                    <label className="block text-slate-400 mb-1">도전자 선택</label>
                    <select
                      value={newBattleForm.challenger}
                      onChange={e => setNewBattleForm({...newBattleForm, challenger: e.target.value})}
                      required
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                    >
                      <option value="">-- 도전자 선택 --</option>
                      {users.map(u => (
                        <option key={u.id} value={u.name}>{u.name} (@{u.username})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">방어자 선택</label>
                    <select
                      value={newBattleForm.defender}
                      onChange={e => setNewBattleForm({...newBattleForm, defender: e.target.value})}
                      required
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100"
                    >
                      <option value="">-- 방어자 선택 --</option>
                      {users.map(u => (
                        <option key={u.id} value={u.name}>{u.name} (@{u.username})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">시행 일자</label>
                    <input type="date" required value={newBattleForm.battleDate} onChange={e => setNewBattleForm({...newBattleForm, battleDate: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                  </div>

                  <button type="submit" className="w-full py-3 bg-rose-600 text-white font-bold rounded-xl">일정 등록</button>
                </form>
                <button onClick={() => setShowAddBattleModal(false)} className="w-full text-slate-500 text-center">취소</button>
              </div>
            </div>
          )}

          {/* PURCHASE MODAL */}
          {selectedItemForPurchase && currentUser && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4">
                <h3 className="font-bold text-slate-100">{selectedItemForPurchase.title} 구매</h3>
                <p className="text-xs text-slate-400">차감 마일리지: {selectedItemForPurchase.price} pt</p>
                <button onClick={handlePurchase} className="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs">구매 확정</button>
                <button onClick={() => setSelectedItemForPurchase(null)} className="w-full text-xs text-slate-500">취소</button>
              </div>
            </div>
          )}

          {/* USE ITEM MODAL */}
          {selectedItemForUse && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4">
                <h3 className="font-bold text-slate-100">{selectedItemForUse.itemTitle} 사용</h3>
                
                {(selectedItemForUse.itemTitle.includes('신청권') || selectedItemForUse.itemTitle.includes('공격권')) && (
                  <select value={targetUserForUse} onChange={(e) => setTargetUserForUse(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-100">
                    <option value="">-- 대상 선택 --</option>
                    {users.filter(u => u.id !== currentUser?.id).map(u => (
                      <option key={u.id} value={u.name}>{u.name}</option>
                    ))}
                  </select>
                )}

                {selectedItemForUse.itemTitle.includes('방어권') && (
                  <select value={targetUserForUse} onChange={(e) => setTargetUserForUse(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-100">
                    <option value="">-- 나를 지목한 공격자 선택 --</option>
                    {getAttackersTargetingMe().length > 0 ? (
                      getAttackersTargetingMe().map(name => (
                        <option key={name} value={name}>{name}</option>
                      ))
                    ) : (
                      <option value="" disabled>현재 나를 공격한 회원이 없습니다</option>
                    )}
                  </select>
                )}
                
                <button onClick={handleUseItem} className="w-full py-3 bg-amber-400 text-slate-950 font-bold rounded-xl text-xs">⚡ 아이템 사용하기</button>
                <button onClick={() => { setSelectedItemForUse(null); setTargetUserForUse(''); }} className="w-full text-xs text-slate-500">취소</button>
              </div>
            </div>
          )}

          {/* ADD ITEM MODAL */}
          {showAddItemModal && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-3 text-xs">
                <h3 className="font-bold text-purple-400 text-sm">신규 상품 추가</h3>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  if (!newItemForm.title || !newItemForm.price) return;
                  const { error } = await supabase.rpc('admin_add_product', { p_title:newItemForm.title, p_category:newItemForm.category, p_price:parseInt(newItemForm.price,10), p_stock:parseInt(newItemForm.stock,10)||99, p_icon:newItemForm.icon||'🎁', p_description:newItemForm.description||'', p_tag:newItemForm.tag||'신규' });
                  if (error) { showToast('상품 등록 실패: '+error.message, 'error'); return; }
                  setShowAddItemModal(false); setNewItemForm({ title:'', category:'게임 아이템', price:'', stock:'', icon:'🎁', description:'', tag:'' }); await refreshData(); showToast('새 상품이 등록되었습니다!', 'success');
                }} className="space-y-3">
                  <input type="text" placeholder="상품명" required value={newItemForm.title} onChange={e => setNewItemForm({...newItemForm, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl" />
                  <input type="number" placeholder="필요 마일리지" required value={newItemForm.price} onChange={e => setNewItemForm({...newItemForm, price: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl" />
                  <textarea placeholder="설명" value={newItemForm.description} onChange={e => setNewItemForm({...newItemForm, description: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl" />
                  <button type="submit" className="w-full py-3 bg-purple-600 text-white font-bold rounded-xl">상품 추가</button>
                </form>
                <button onClick={() => setShowAddItemModal(false)} className="w-full text-slate-500">취소</button>
              </div>
            </div>
          )}

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4">
                <h3 className="font-bold text-center text-slate-100">{authMode === 'login' ? '로그인' : '회원가입'}</h3>
                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  <input type="text" placeholder="아이디" required value={authForm.username} onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                  {authMode === 'signup' && (
                    <input type="text" placeholder="이름/닉네임" required value={authForm.name} onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                  )}
                  <input type="password" placeholder="비밀번호" required value={authForm.password} onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                  <button type="submit" className="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl">확인</button>
                </form>
                <button onClick={() => setShowAuthModal(false)} className="w-full text-center text-xs text-slate-500">닫기</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
